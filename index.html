  <title>Nadnad's 22nd Birthday💗</title>

 <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap'); 
 :root {
    --pink-0: #fffafd;
    --pink-1: #fff2f7;
    --pink-2: #ffe5ef;
    --pink-3: #ffd0e0;
    --pink-4: #f7aec7;
    --pink-5: #ef8fb2;
    --pink-6: #d8789d;
    --text: #754d63;
    --text-soft: #a97f94;
    --white: #ffffff;
    --gold: #edc3a0;
    --shadow: 0 22px 55px rgba(216, 120, 157, .2);
    --radius: 22px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    min-height: 100%;
    scroll-behavior: smooth;
    background: var(--pink-1);
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 10% 0%, rgba(255,255,255,.95), transparent 28%),
      radial-gradient(circle at 90% 100%, rgba(255,208,224,.7), transparent 32%),
      var(--pink-1);
    color: var(--text);
    font-family: "DM Sans", sans-serif;

body::before {
    content: "";
    position: fixed;
    inset: -24px;
    z-index: -1;
    background:
      linear-gradient(rgba(255, 245, 248, 0.35), rgba(255, 255, 255, 0.82)),
      url("bg.jpg") center center / cover no-repeat;
    filter: blur(5px);
    transform: scale(1.05);
    pointer-events: none;
  }

    min-height: 46px;
    border: 0;
    cursor: pointer;

  }

    outline-offset: 3px;

  img {

    width: 100%;
    height: 100%;

  }

  .hidden {
    display: none !important;
  }

  /* Shared */

  .pink-button {
    padding: 14px 22px;
    border: 1px solid rgba(216,120,157,.15);
    border-radius: 999px;
    background: var(--pink-4);
    color: var(--text);
    box-shadow: 0 12px 24px rgba(216,120,157,.16);
    transition: transform .25s ease, background .25s ease, color .25s ease;
  }

  .pink-button:hover,
  .pink-button:active {
    background: var(--pink-5);
    color: var(--white);
    transform: translateY(-2px);
  }

  .eyebrow {
    margin-bottom: 15px;
    color: var(--pink-6);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .small-note {
    color: var(--text-soft);
    font-size: 12px;
    line-height: 1.7;
  }

  /* Background decoration */

  .floating-heart {
    position: fixed;
    z-index: -1;
    color: rgba(239,143,178,.24);
    font: 34px "Playfair Display", serif;
    pointer-events: none;
    animation: floatingHeart 7s ease-in-out infinite;
  }

  .floating-heart.one {
    top: 12%;
    left: 6%;
  }

  .floating-heart.two {
    right: 7%;
    bottom: 18%;
    font-size: 52px;
    animation-delay: 2s;
  }

  .floating-heart.three {
    bottom: 7%;
    left: 18%;
    font-size: 24px;
    animation-delay: 4s;
  }

  @keyframes floatingHeart {
    0%, 100% {
      transform: translateY(0) rotate(0deg);
    }

    50% {
      transform: translateY(-20px) rotate(10deg);
    }
  }

  /* Password opening */

 .password-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding:
      max(24px, env(safe-area-inset-top))
      22px
      max(24px, env(safe-area-inset-bottom));
    background: transparent;
    overflow: hidden;
    transition: opacity .8s ease, visibility .8s ease;
  }

  .password-screen::before {
    content: "";
    position: fixed;
    inset: -24px;
    z-index: -1;
    background:
      linear-gradient(rgba(255, 245, 248, 0.35), rgba(255, 255, 255, 0.82)),
      url('bg.jpg') center center / cover no-repeat;
    filter: blur(5px);
    transform: scale(1.05);
  }

  .password-screen.closed {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .password-card {
    position: relative;
    z-index: 1;
    width: min(390px, 100%);
    padding: 38px 25px 32px;
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: var(--radius);
    background: rgba(255, 250, 253, 0.92);
    box-shadow: var(--shadow);
    text-align: center;
  }

  .lock-heart {
    width: 70px;
    height: 70px;
    display: grid;
    place-items: center;
    margin: 0 auto 22px;
    border: 1px solid var(--pink-4);
    border-radius: 50%;
    color: var(--pink-6);
    font: 34px "Playfair Display", serif;
    animation: gentlePulse 2s ease-in-out infinite;
  }

@keyframes flameGentlePulse {
  0%,
  100% {
    opacity: 0.90 !important;
    transform:
      translateX(-50%)
      scaleX(0.94)
      scaleY(0.95) !important;
  }

  50% {
    opacity: 1 !important;
    transform:
      translateX(-50%)
      scaleX(1.08)
      scaleY(1.15) !important;
  }
}

  .password-card h1 {
    color: var(--pink-6);
    font: 600 clamp(39px, 12vw, 64px)/.95 "Playfair Display", serif;
  }

  .password-card h1 em {
  color: var(--pink-5);
  display: inline-block;
  transform: translateY(8px); /* Increase pixel value to push lower */
}

  .password-card > p {
    margin: 20px auto 25px;
    color: var(--text-soft);
    line-height: 1.7;
  }

  .password-form {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .password-input {
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border: 1px solid var(--pink-3);
    border-radius: 14px;
    outline: 0;
    background: var(--pink-0);
    color: #d1d5db; /* <-- Change this to light gray (was #a0a0a0) */
    font-size: 17px;
    letter-spacing: 5px;
    text-align: center;
  }

  /* Optional: Light gray for placeholder text when empty */
  .password-input::placeholder {
    color: #d1d5db;
  }

  .password-input:focus {
    border-color: var(--pink-5);
    box-shadow: 0 0 0 4px rgba(239, 143, 178, .14);
  }

  .password-input:not(:placeholder-shown) {
    color: #000000;
  }

  .password-error {
    min-height: 20px;
    color: var(--pink-6);
    font-size: 12px;
  }

  /* Celebration */

 /* Celebration */

  .celebration {

    width: 100%;

    justify-content: center;

      max(20px, env(safe-area-inset-top))

  .celebration-content {
    position: relative;
    z-index: 5;

 .celebration h2 {
 position: relative;
 z-index: 20;
 color: var(--pink-6);
 font: 600 clamp(43px, 13vw, 70px)/.95 "Playfair Display", serif;
 transform: translateY(-24px);

}

.celebration h2 em {
 display: block;

margin-top: 10px;
}
.birthday-22 {
 display: inline-block;
 margin: 0 1px;
 color: #ef8fb2;
 font-family: "Fredoka", sans-serif;

 font-weight: 700;

.celebration h2 sup {

.number-22 {

  .cake-stage {

  .celebration-message {

  .skip-button.visible {

  }

  /* Fireworks */

  #fireworksCanvas {
    position: fixed;
    z-index: 20;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Confetti */

  .confetti-piece {
  position: fixed;
  z-index: 35;
  top: -32px;
  border-radius: 2px;
  pointer-events: none;
  opacity: 0;
  will-change: transform, opacity;
  animation-name: confettiFallDown;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes confettiFallDown {
  0% {
    opacity: 0;
    transform: translate3d(0, -35px, 0) rotate(0deg);
  }

  8% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform:
      translate3d(
        var(--confetti-drift, 0px),
        115vh,
        0
      )
      rotate(var(--confetti-spin, 720deg));
  }
}

  /*
Garland lights */

  .garland-clip {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: center;
    width: 12px;
    height: 13px;
    margin-bottom: -2px;
  }

  .garland-clip svg {
    position: relative;
    z-index: 2;

  }

  .garland-light {
    position: absolute;
    z-index: 1;
    top: -5px;
    left: 50%;
    width: 6px;
    height: 6px;
    border: 1px solid rgba(255, 238, 177, 0.95);
    border-radius: 50%;
    background: #fff4bf;
    box-shadow:
      0 0 4px #fff4bf,
      0 0 9px rgba(255, 211, 140, 0.95),
      0 0 15px rgba(255, 184, 207, 0.7);
    transform: translateX(-50%);
    animation: garlandLightTwinkle 1.8s ease-in-out infinite alternate;
    animation-delay: var(--light-delay, 0s);
  }

  @keyframes garlandLightTwinkle {
    from {
      opacity: 0.45;

    }

    to {
      opacity: 1;
      transform: translateX(-50%) scale(1.12);
    }
  }

}

function revealPhotoGarland() {

  const totalPhotos = birthdayPhotos.length;
  const containerWidth = 680;

  // --- LINE 38 & 39: ADJUST FOR A DEEP DOWNWARD CURVE ---
  const rx = 300;

  const centerY = 50; // HIGHER ANCHOR POINT FOR THE APEX

  const svgNS = "http://www.w3.org/2000/svg";

    position: absolute;
    inset: 0;
    z-index: 1;

  `;

  const pathPoints = [];
  const startAngle = Math.PI * 0.98;
  const endAngle = Math.PI * 0.02;

  for (let index = 0; index < totalPhotos; index++) {
    const angle = startAngle - (index / (totalPhotos - 1)) * (startAngle - endAngle);
    pathPoints.push({
      x: centerX + rx * Math.cos(angle),
      y: centerY + ry * Math.sin(angle)
    });
  }

  let pathData = `M ${pathPoints[0].x} ${pathPoints[0].y}`;

  for (let index = 1; index < pathPoints.length; index++) {
    const previous = pathPoints[index - 1];
    const current = pathPoints[index];
    const controlX = (previous.x + current.x) / 2;
    
    // --- LINE 61: INCREASE TO + 18 FOR DEEPER DOWNWARD ARC SAG ---
    const controlY = (previous.y + current.y) / 2 + 18; 
    pathData += ` Q ${controlX} ${controlY}, ${current.x} ${current.y}`;
  }

  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d", pathData);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "#d8789d");
  path.setAttribute("stroke-width", "2");
  path.setAttribute("stroke-dasharray", "4 2");

    `;

    const clip = document.createElement("div");

    clip.style.setProperty("--light-delay", `${index * 0.14}s`);
    clip.innerHTML = `
      <span class="garland-light" aria-hidden="true"></span>
      <svg width="10" height="12" viewBox="0 0 10 12" fill="none">
        <rect x="3" y="0" width="4" height="10" rx="1" fill="#edc3a0" stroke="#a06040" stroke-width="0.8" />
        <circle cx="5" cy="4" r="1" fill="#a06040"></circle>
      </svg>
    `;

   const photoCard = document.createElement("div");
photoCard.style.cssText = `

`;
    const image = document.createElement("img");

    image.alt = `Garland Memory ${index + 1}`;

  // --- LINES AT THE BOTTOM OF THE FUNCTION RE-ADDING THE TEXT & BUTTON ---

  let fireworksParticles = [];

  function resizeCanvas() {
    if (!fireworksCanvas || !fireworksContext) {
      return;
    }

    const ratio = window.devicePixelRatio || 1;

    fireworksCanvas.width = window.innerWidth * ratio;
    fireworksCanvas.height = window.innerHeight * ratio;
    fireworksCanvas.style.width = `${window.innerWidth}px`;
    fireworksCanvas.style.height = `${window.innerHeight}px`;

    fireworksContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  if (fireworksCanvas) {
    resizeCanvas();

  function launchFireworks() {
    if (fireworksRunning || !fireworksCanvas) {
      return;
    }

    fireworksRunning = true;

    for (let index = 0; index < 8; index++) {
      setTimeout(() => {
        createFirework(
          Math.random() * window.innerWidth,
          100 + Math.random() * (window.innerHeight * 0.45)
        );
      }, index * 420);

    animateFireworks();

    setTimeout(() => {
      fireworksRunning = false;
    }, 6000);

  function createFirework(x, y) {
    const colors = [
      "#f48eb5",
      "#f7aec7",
      "#ffd0e0",
      "#edc3a0",
      "#ffffff"
    ];

    for (let index = 0; index < 40; index++) {
      const angle = (Math.PI * 2 * index) / 40;
      const speed = 1.5 + Math.random() * 3;

      fireworksParticles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function animateFireworks() {
    if (!fireworksContext) {
      return;
    }

    fireworksContext.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );

    fireworksParticles.forEach(particle => {
      particle.x += particle.vx;
      particle.y += particle.vy;
      particle.vy += 0.025;
      particle.life -= 0.014;

      fireworksContext.globalAlpha = Math.max(particle.life, 0);
      fireworksContext.fillStyle = particle.color;
      fireworksContext.beginPath();
      fireworksContext.arc(
        particle.x,
        particle.y,
        2.5,
        0,
        Math.PI * 2
      );
      fireworksContext.fill();
    });

    fireworksContext.globalAlpha = 1;

    fireworksParticles = fireworksParticles.filter(
      particle => particle.life > 0
    );

    if (fireworksRunning || fireworksParticles.length > 0) {
      requestAnimationFrame(animateFireworks);
    } else {
      fireworksContext.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );
    }
  }

  function stopContinuousConfetti() {
    if (confettiInterval) {
      clearInterval(confettiInterval);
      confettiInterval = null;
    }

    confettiStarted = false;

    document.querySelectorAll(".confetti-piece").forEach(piece => {
      piece.remove();
    });
  }

  function createConfetti(amount = 8) {
    const colors = [
      "#f48eb5",
      "#f7aec7",
      "#ffd0e0",
      "#fff2f7",
      "#edc3a0",
      "#ffffff"
    ];

    for (let index = 0; index < amount; index++) {
      const piece = document.createElement("div");
      const size = 6 + Math.random() * 7;
      const duration = 3.8 + Math.random() * 2.8;
      const horizontalDrift = (Math.random() - 0.5) * 180;

      piece.className = "confetti-piece";
      piece.style.left = `${Math.random() * 100}vw`;
      piece.style.width = `${size}px`;
      piece.style.height = `${size * 1.45}px`;

      piece.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      piece.style.setProperty(
        "--confetti-drift",
        `${horizontalDrift}px`
      );

      piece.style.setProperty(
        "--confetti-spin",
        `${360 + Math.random() * 720}deg`
      );

      piece.style.animationDuration = `${duration}s`;
      piece.style.animationDelay = `${Math.random() * 0.35}s`;

      document.body.appendChild(piece);

      setTimeout(() => {
        piece.remove();
      }, (duration + 1) * 1000);
    }
  }

  /* Hearts */

  function createHeartBurst() {
    const colors = [
      "#f48eb5",
      "#f7aec7",
      "#d8789d",
      "#edc3a0"
    ];

    for (let index = 0; index < 25; index++) {
      const heart = document.createElement("div");

      heart.textContent = "♡";
      heart.style.position = "fixed";
      heart.style.zIndex = "50";
      heart.style.left = "50%";
      heart.style.top = "50%";
      heart.style.color =
        colors[Math.floor(Math.random() * colors.length)];
      heart.style.fontSize = `${15 + Math.random() * 22}px`;
      heart.style.pointerEvents = "none";

      const x = (Math.random() - 0.5) * 360;
      const y = (Math.random() - 0.5) * 500;

      heart.animate(
        [
          {
            transform: "translate(-50%, -50%) scale(0)",
            opacity: 1
          },
          {
            transform:
              `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.2)`,
            opacity: 0
          }
        ],
        {
          duration: 1300 + Math.random() * 500,
          easing: "cubic-bezier(.2,.8,.3,1)"
        }
      );

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 2000);
    }
  }
