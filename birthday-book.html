<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaiology ♡♡♡</title>

  <style>
    :root{
      --ink:#704357;
      --paper:#fffaf9;
      --mint:#cfe8df;
      --yellow:#f6d77c;
      --shadow:rgba(94,42,65,.24);
      --page-w:560px;
      --page-h:750px;
      --book-w:1120px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Trebuchet MS","Comic Sans MS",cursive,sans-serif;
    }

    body{
      color:var(--ink);
      position:relative;
      isolation:isolate;
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      z-index:-2;
      inset:-24px;
      background:
        linear-gradient(rgba(237,239,241,0),rgba(255,255,255,.78)),
        url("background.jpg") center center / cover no-repeat;
      filter:blur(5px);
      transform:scale(1.05);
    }

    body::after{
      content:"";
      position:fixed;
      z-index:-1;
      inset:0;
      pointer-events:none;
      background:rgba(180,220,255,.16);
    }

    button{font:inherit}

    .scrapbook-only {
  height: 100vh;
  display: grid;
  place-items: center;
  padding: -50px;
  position: relative;
  z-index: 2;
  overflow: hidden;
}

    .book-wrap {
  width: var(--book-w);
  position: relative;
  perspective: 2600px;
  margin-top: -20px; /* move the whole book up */
}

    /* FRONT COVER */

    .cover{
      width:var(--page-w);
      height:var(--page-h);
      margin:auto;
      position:relative;
      overflow:hidden;
      display:grid;
      place-items:center;
      border:10px solid #fff8fa;
      border-radius:18px 28px 28px 18px;
      cursor:pointer;
      transform-origin:left center;
      transform-style:preserve-3d;
      touch-action:manipulation;
      background:
        repeating-linear-gradient(0deg,#fff4 0 1px,transparent 1px 5px),
        repeating-linear-gradient(90deg,#cf8fa60c 0 1px,transparent 1px 7px),
        radial-gradient(circle at 80% 13%,#fff9 0 4px,transparent 5px),
        linear-gradient(135deg,#fdebf1,#f6cbd9 48%,#f9e0e8);
      box-shadow:
        0 34px 68px #52233866,
        inset 0 0 0 4px #e6a7bd55,
        inset -22px 0 32px #9b46651b;
      transition:transform 1s cubic-bezier(.18,.8,.2,1),opacity .6s ease;
    }

    .cover::before{
      content:"";
      position:absolute;
      width:250px;height:250px;
      left:-140px;bottom:-130px;
      border-radius:50%;
      border:16px dotted #fff9;
      opacity:.62;
    }

    .cover::after{
      content:"";
      position:absolute;
      width:250px;height:120px;
      right:-105px;top:40%;
      border-top:8px dashed #d8759b66;
      border-bottom:8px dashed #fff9;
      transform:rotate(-28deg);
    }

    .cover.open{
      opacity:0;
      pointer-events:none;
      transform:rotateY(-118deg);
    }

    .cover *{pointer-events:none}

    .spine{
      position:absolute;
      inset:0 auto 0 3.5%;
      width:46px;
      background:
        repeating-linear-gradient(0deg,#fff3 0 2px,transparent 2px 10px),
        linear-gradient(90deg,#71364f88,#fff4 38%,transparent);
      box-shadow:20px 0 22px #67284322;
    }

    .paper{
      position:absolute;
      border:2px solid #fff9;
      box-shadow:5px 8px 13px var(--shadow);
    }

    .paper.a{width:135px;height:90px;top:9%;left:8%;background:repeating-linear-gradient(0deg,#d37a9820 0 1px,transparent 1px 6px),#ffeaf0;transform:rotate(-10deg)}
    .paper.b{width:130px;height:115px;right:5%;bottom:11%;background:repeating-linear-gradient(45deg,#fff5 0 4px,transparent 4px 9px),var(--mint);transform:rotate(10deg)}
    .paper.c{width:128px;height:85px;left:12%;bottom:9%;background:repeating-linear-gradient(0deg,#dea1b11f 0 1px,transparent 1px 8px),#fff4c4;transform:rotate(8deg)}
    .paper.d{width:110px;height:95px;right:7%;top:25%;background:repeating-linear-gradient(0deg,#da86a51f 0 1px,transparent 1px 7px),#fef6be;transform:rotate(-11deg)}
    .paper.e{width:110px;height:75px;left:4%;top:42%;background:repeating-linear-gradient(45deg,#fff8 0 5px,transparent 5px 10px),#d9eee5;transform:rotate(-9deg)}

    .tape{
      position:absolute;
      width:118px;height:26px;
      opacity:.85;
      box-shadow:2px 4px 5px #5a2a3d22;
      background:
        repeating-linear-gradient(45deg,#fff7 0 3px,transparent 3px 8px),
        #f2b0c3;
    }

    .tape.a{top:8%;left:42%;transform:rotate(-8deg)}
    .tape.b{bottom:8%;right:31%;background-color:var(--yellow);transform:rotate(8deg)}
    .tape.c{width:85px;top:36%;left:5%;background-color:#bfe1d8;transform:rotate(20deg)}
    .tape.d{width:78px;top:42%;right:2%;background-color:#e6b4df;transform:rotate(-20deg)}

    .flower{
      width:72px;height:72px;
      position:absolute;
      filter:drop-shadow(3px 5px 4px #6b2f4833);
    }

    .flower i{
      width:32px;height:46px;
      position:absolute;top:12px;left:20px;
      border-radius:70% 30% 70% 30%;
      background:linear-gradient(135deg,#fff5f8,#ed9cba);
      transform-origin:16px 23px;
    }

    .flower i:nth-child(1){transform:rotate(0)}
    .flower i:nth-child(2){transform:rotate(72deg)}
    .flower i:nth-child(3){transform:rotate(144deg)}
    .flower i:nth-child(4){transform:rotate(216deg)}

    .flower b{
      width:20px;height:20px;
      position:absolute;top:26px;left:26px;
      border-radius:50%;
      background:#f6d577;
      border:3px dotted #c76a8c;
    }

    .flower.a{top:13%;left:6%;transform:rotate(-16deg)}
    .flower.b{right:6%;bottom:16%;transform:rotate(15deg)}
    .flower.c{bottom:8%;left:26%;transform:scale(.62)}
    .flower.d{top:7%;right:20%;transform:scale(.66) rotate(20deg)}
    .flower.e{bottom:31%;right:1%;transform:scale(.53) rotate(-18deg)}

    .cover-leaf{
      position:absolute;
      width:54px;height:25px;
      border-radius:100% 0 100% 0;
      background:linear-gradient(135deg,#acd8bd,#5caa7f);
      box-shadow:2px 4px 4px #59314122;
    }

    .cover-leaf.a{left:13%;top:17%;transform:rotate(-39deg)}
    .cover-leaf.b{left:15%;top:20%;transform:rotate(34deg)}
    .cover-leaf.c{right:7%;bottom:27%;transform:rotate(-28deg)}
    .cover-leaf.d{right:12%;bottom:24%;transform:rotate(42deg)}

.bow {
  width: 106px;
  height: 155px;
  position: absolute;
  top: 5%;
  right: 9%;
  filter: drop-shadow(3px 6px 4px #64294133);
  transform: rotate(45deg) scale(1.2);
  transform-origin: center center;
}

.bow::before,
.bow::after {
  content: "";
  width: 48px;
  height: 37px;
  position: absolute;
  top: 10px;
  border-radius: 65% 28% 65% 28%;
  background: linear-gradient(145deg, #f6c1d2, #d96f98);
}

.bow::before { left: 2px; transform: rotate(18deg); }
.bow::after { right: 2px; transform: scaleX(-1) rotate(18deg); }

.bow span {
  width: 23px;
  height: 25px;
  position: absolute;
  z-index: 2;
  top: 17px;
  left: 37px;
  border-radius: 45%;
  background: #c95e87;
}

    .bow.small{
      width:64px;height:45px;
      right:3%;top:59%;
      transform:rotate(-20deg) scale(.72);
    }

    .cover-cd{
      width:80px;height:80px;
      position:absolute;right:20%;bottom:12%;
      border-radius:50%;
      background:conic-gradient(#f6a4bd,#b9ddd7,#f6d479,#e8b5cc,#f6a4bd);
      box-shadow:4px 7px 8px #542a3a33;
      transform:rotate(20deg);
    }

    .cover-cd::before{
      content:"";
      position:absolute;inset:13px;
      border:1px solid #fff;
      border-radius:50%;
    }

    .cover-cd::after{
      content:"";
      width:15px;height:15px;
      position:absolute;top:32px;left:32px;
      border:5px solid white;
      border-radius:50%;
      background:#e98eae;
    }

    .polaroid {
  width: 120px;
  position: absolute;
  bottom: 15%;
  left: 8%;
  padding: 7px 7px 16px;
  color: #a35b75;
  font-size: .55rem;
  font-weight: bold;
  text-align: center;
  background: white;
  box-shadow: 5px 8px 13px #67324a33;
  transform: rotate(-9deg);
}

.polaroid div {
  height: 75px;
  width: 100%;
  margin-bottom: 8px; /* Adds space between image and text */
  overflow: hidden;   /* Keeps image edges contained */
  background: #eee;   /* Fallback color while image loads */
}

.polaroid div img {
  width: 100%;
  height: 100%;
  object-fit: cover;  /* Crops image nicely without stretching */
  display: block;
}

    .tag,
    .stamp{
      position:absolute;
      display:grid;place-items:center;text-align:center;
      font-size:.54rem;font-weight:bold;color:#b3557d;
      background:#fff8dc;
      box-shadow:3px 5px 6px #612d401f;
    }

    .tag{
      width:80px;height:54px;top:27%;right:13%;
      border:2px dashed #ce7694;
      transform:rotate(-8deg);
    }

    .stamp{
      width:62px;height:62px;right:7%;bottom:8%;
      border:5px double #cd6e90;
      border-radius:50%;
      background:#fff8fa99;
      transform:rotate(13deg);
        font-size: .99rem; 
    }

    .heart-seal{
      width:41px;height:41px;
      position:absolute;
      display:grid;place-items:center;
      color:#fff;font-size:1rem;
      border-radius:50%;
      background:radial-gradient(circle at 34% 29%,#ee9fbd,#bd4b76 72%);
      box-shadow:3px 5px 7px #60304444;
    }

    .heart-seal.a{left:7%;bottom:34%;transform:rotate(-11deg)}
    .heart-seal.b{right:4%;top:47%;transform:rotate(15deg) scale(.82)}

    .cover-photo-stack{
      width:190px;min-height:163px;
      position:absolute;z-index:6;top:7%;left:52%;
      padding:8px 8px 23px;
      background:#fff;
      box-shadow:7px 10px 18px #6330454d;
      transform:translateX(-50%) rotate(-3deg);
    }

    .cover-photo-stack::before,
    .cover-photo-stack::after{
      content:"";
      position:absolute;z-index:-1;
      width:177px;height:145px;left:6px;top:6px;
      box-shadow:4px 7px 9px #6330452b;
    }

    .cover-photo-stack::before{
      background:#f7e1a1;
      transform:rotate(-8deg) translate(-9px,5px);
    }

    .cover-photo-stack::after{
      background:#c7e6da;
      transform:rotate(8deg) translate(10px,6px);
    }

    .cover-photo-stack img{
      display:block;width:100%;height:123px;
      object-fit:cover;
      background:linear-gradient(135deg,#eeaac2,#ffe9ef 55%,#cbe5dd);
    }

    .cover-photo-stack span{
      display:block;margin-top:7px;
      color:#ae5c7d;font-size:.58rem;font-weight:bold;
      letter-spacing:.07em;text-align:center;
    }

    .cover-photo-heart{
      position:absolute;z-index:8;right:-14px;bottom:-8px;
      width:38px;height:38px;
      display:grid;place-items:center;
      color:#fff;font-size:1rem;
      border-radius:50%;
      background:#d65d8d;
      box-shadow:2px 4px 6px #63304545;
      transform:rotate(11deg);
    }

    .cover-title{
      width:82%;
      position:absolute;z-index:10;top:50%;left:50%;
      margin:0;padding:26px 21px;
      border:3px solid #fff;
      border-radius:13px;
      text-align:center;
      background:
        repeating-linear-gradient(0deg,#e5779e12 0 1px,transparent 1px 5px),
        #fffafd;
      box-shadow:0 10px 0 #e9a0b7,0 19px 28px #6b304733;
      transform:translate(-50%,-50%) rotate(-1.5deg);
    }

    .cover-title::before,
    .cover-title::after{
      content:"";
      position:absolute;
      width:80px;height:21px;top:-13px;
      background:
        repeating-linear-gradient(45deg,#fff8 0 3px,transparent 3px 8px),
        #f3b2c5;
      opacity:.86;
    }

    .cover-title::before{left:21px;transform:rotate(-10deg)}
    .cover-title::after{right:21px;transform:rotate(10deg);background-color:#bfe2d8}

    .cover-title p{
      margin:0;color:#8b5a6e;
      font-size:.89rem;font-weight:bold;letter-spacing:.12em;
    }

    .cover-title h1 {
  margin: 10px 0;
  color: #bd527d;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 3.5rem; /* CHANGED FROM 4.3rem TO MAKE IT SMALLER */
  font-style: italic;
  line-height: .83;
  text-shadow: 2px 2px white, 5px 6px #d3739729;
}

   .cover-title .date {
  font-size: 20px;
  color: #d2648e;
  margin-top: 20px; /* ADD THIS: Increase to move it further down */
  display: block;   /* Ensures top margin applies cleanly if it's a <span> */
}
    .cover-title .author{margin-top:17px}

    .cover-tip{
      position:absolute;z-index:11;bottom:20px;
      color:#a55c78;font-size:.65rem;font-weight:bold;letter-spacing:.1em;
    }

    /* OPEN BOOK */

    .open-book{
      position:absolute;inset:0;
      opacity:0;visibility:hidden;
      transform:translateY(10px) scale(.99);
      transition:opacity .35s ease,transform .35s ease,visibility .35s ease;
      pointer-events:none;
    }

    .open-book.show{
      opacity:1;visibility:visible;transform:none;pointer-events:auto;
    }

    .book-body{
      width:var(--book-w);
      height:var(--page-h);
      position:relative;
      display:grid;
      grid-template-columns:var(--page-w) var(--page-w);
      border-radius:16px 21px 21px 16px;
      background:#9d5d7b;
      box-shadow:0 34px 68px #56223966;
      perspective:2600px;
      perspective-origin:center center;
      transform-style:preserve-3d;
    }

    .book-body::before{
      content:"";
      position:absolute;z-index:90;
      top:0;bottom:0;left:calc(50% - 11px);
      width:22px;pointer-events:none;
      background:linear-gradient(90deg,#501e3375,#fff8,#501e3350);
    }

    .page{
      width:var(--page-w);height:var(--page-h);
      position:relative;overflow:hidden;
      padding:25px;
      background:
        radial-gradient(circle at 14% 11%,#fff9 0 2px,transparent 3px),
        repeating-linear-gradient(0deg,#ab54740d 0 1px,transparent 1px 5px),
        var(--paper);
      transform-style:preserve-3d;
      backface-visibility:hidden;
    }

    .left{
      border-radius:14px 0 0 14px;
      box-shadow:inset -26px 0 34px #72364f21;
    }

    .right{
      border-radius:0 14px 14px 0;
      box-shadow:inset 26px 0 34px #72364f21;
    }

    .theme-birthday{background-color:#fff4f8}
    .theme-food{background-color:#fff9e7}
    .theme-travel{background-color:#edf9f5}
    .theme-biology{background-color:#f0fff8}
    .theme-music{background-color:#f8f0ff}
    .theme-movies{background-color:#fff4e6}
    .theme-loves{background-color:#fff1f8}
    .theme-childhood{background-color:#fff8e9}
    .theme-memories{background-color:#fff3f5}
    .theme-friends{background-color:#f4efff}
    .theme-us{background-color:#fff2f7}
    .theme-romance{background-color:#fff2f7}
    .theme-dreams{background-color:#edf6ff}
    .theme-final{background-color:#fff2f7}

    .stitch{
      position:absolute;z-index:1;inset:13px;
      border:2px dashed #cd799733;
      border-radius:8px;
    }

    .scrap{
      position:absolute;z-index:2;
      width:96px;height:28px;opacity:.75;
      background:
        repeating-linear-gradient(45deg,#fff7 0 4px,transparent 4px 9px),
        #f1a8bf;
      box-shadow:3px 4px 7px #6330451f;
    }

    .scrap.a{right:2%;top:21%;transform:rotate(-13deg)}
    .scrap.b{left:3%;bottom:13%;background-color:#aedde4;transform:rotate(14deg)}
    .scrap.c{width:72px;height:23px;right:14%;bottom:6%;background-color:#f4d777;transform:rotate(-9deg)}

    .art{
      position:absolute;z-index:2;pointer-events:none;
      filter:drop-shadow(2px 3px 2px #68344a22);
    }

    .art.one{top:85px;right:21px}
    .art.two{bottom:56px;left:21px}

    .art.one::before{
      content:"";display:block;
      width:73px;height:54px;
      border:2px dashed #d885a2;
      background:
        repeating-linear-gradient(0deg,transparent 0 10px,#db8eaa33 11px 12px),
        #fff4c6;
      transform:rotate(7deg);
    }

    .art.two::before{
      content:"";display:block;
      width:53px;height:53px;
      border:8px dotted #da86a5;
      border-radius:50%;
    }

    .heading{
      position:relative;z-index:30;
      display:inline-block;max-width:79%;
      margin:0 0 7px;padding:8px 12px;
      border:2px dashed #bf537e66;
      border-radius:6px;
      color:#bd537d;font-size:1.22rem;
      background:#fff9fbe8;
      box-shadow:3px 4px 0 #eab0c366;
      transform:rotate(-1deg);
    }

    .subtitle{
      position:relative;z-index:30;
      margin:0 0 9px;
      color:#8f6375;font-size:.73rem;line-height:1.35;
    }

    .cards{
      position:relative;z-index:30;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:13px;
      align-content:start;
    }

    .photo,
    .note{
      min-width:0;padding:8px;
      background:white;
      box-shadow:4px 7px 12px #68344a30;
      transform:rotate(var(--r,0deg));
    }

    .photo:nth-child(2n),
    .note:nth-child(2n){--r:1.3deg}

    .photo:nth-child(3n),
    .note:nth-child(3n){--r:-1.2deg}

    .photo{position:relative;min-height:215px}

    .photo::before{
      content:"";
      width:61px;height:16px;
      position:absolute;z-index:3;top:-9px;left:50%;
      opacity:.82;
      background:
        repeating-linear-gradient(45deg,#fff7 0 3px,transparent 3px 7px),
        #f2a9c0;
      transform:translateX(-50%) rotate(-3deg);
    }

    .photo-image{
      aspect-ratio:.72 / 1;
      display:grid;place-items:center;overflow:hidden;
      border:7px solid white;
      color:#74495b;font-size:.68rem;font-weight:bold;text-align:center;
      background:linear-gradient(135deg,#f5b9ce,#fde5ec 55%,#c9e4dc);
    }

    .photo-image img{
      width:100%;height:100%;object-fit:cover;
    }

    .photo figcaption{
  padding:7px 2px 1px;
  color:#925c71;
  font-size:.78rem;
  text-align:center;
}

    .note{
  min-height:150px;
  position:relative;
  padding:14px;
  color:#825b6c;
  font-size:.80rem;
  line-height:1.45;
  border:1px solid #f0bdd0;
  background:
    linear-gradient(90deg,transparent 0 18px,#f7bdcf66 19px 20px,transparent 21px),
    repeating-linear-gradient(0deg,#fff 0 22px,#eea3bc66 23px 24px),
    #fff;
}

    .note::after{
      content:"♡";
      position:absolute;right:9px;bottom:7px;
      color:#dc7299;font-size:1.15rem;
    }

    .note strong{
      display:block;margin-bottom:6px;
      color:#bd527c;font-size:.85rem;
    }

    .photo-row{
      position:relative;z-index:30;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;margin-top:12px;padding:0 27px;
    }

    .photo-row .small-portrait{
      position:relative;min-height:160px;padding:7px;
      background:#fff;
      box-shadow:4px 6px 9px #68344a2f;
      transform:rotate(var(--mini-r,0deg));
    }

    .photo-row .small-portrait:nth-child(1){--mini-r:-2deg}
    .photo-row .small-portrait:nth-child(2){--mini-r:1.8deg}

    .small-portrait::before{
      content:"";
      position:absolute;top:-8px;left:50%;
      width:52px;height:14px;
      background:
        repeating-linear-gradient(45deg,#fff7 0 3px,transparent 3px 8px),
        #c7e4da;
      transform:translateX(-50%) rotate(4deg);
    }

    .small-portrait:nth-child(2)::before{
      background-color:#f1b4c8;
      transform:translateX(-50%) rotate(-5deg);
    }

    .small-portrait-image{
      height:125px;
      display:grid;place-items:center;overflow:hidden;
      color:#8e5a70;font-size:.58rem;font-weight:bold;text-align:center;
      background:linear-gradient(135deg,#f2b3c9,#ffe5ec 55%,#bce0d6);
    }

    .small-portrait-image img{
      width:100%;height:100%;object-fit:cover;
    }

    .small-portrait-label{
  display:block;
  padding-top:6px;
  color:#a35c77;
  font-size:.64rem;
  font-weight:bold;
  text-align:center;
}

    /* BASE DECOR SYSTEM */

    .theme-decor{
      position:absolute;z-index:5;inset:0;pointer-events:none;
    }

    .theme-decor span,
    .theme-decor i,
    .theme-decor b{
      position:absolute;display:block;
    }

    .decor-bow{
      width:67px;height:41px;
      right:30px;top:25px;
      filter:drop-shadow(2px 3px 2px #69364a35);
    }

    .decor-bow::before,
    .decor-bow::after{
      content:"";
      position:absolute;top:7px;
      width:35px;height:27px;
      border-radius:70% 24% 70% 24%;
      background:linear-gradient(145deg,#ffd1df,#dc7098);
    }

    .decor-bow::before{left:1px;transform:rotate(18deg)}

    /* NAVIGATION */

    .tab{
      width:88px;min-height:54px;
      position:absolute;z-index:100;top:50%;

    }

    .prev{
      left:-65px;
      clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%);
    }

    .tab:hover{background:#ffc6d7}
    .tab:active{background:#ffb3c9}
    .tab:disabled{opacity:0;pointer-events:none}

    .count{
      position:absolute;
      bottom:-32px;
      left:50%;
      transform:translateX(-50%);
      color:#a9466c;
      font-size:.78rem;
      letter-spacing:.11em;
    }

    /* FLOATING HEARTS */

    #floatingHearts{
      position:fixed !important;
      z-index:1 !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      overflow:hidden !important;
      pointer-events:none !important;
    }

    #floatingHearts .floating-heart{
      position:absolute !important;
      display:block !important;
      top:-100px !important;
      color:#e9a4bc !important;
      font-family:Georgia,"Times New Roman",serif !important;
      font-size:var(--heart-size,48px) !important;
      line-height:1 !important;
      opacity:.78 !important;
      animation:fallHeart var(--heart-duration,12s) linear infinite !important;
      animation-delay:var(--heart-delay,0s) !important;
    }

    @keyframes fallHeart{
      from{
        transform:translate3d(0,-115vh,0) rotate(0deg) scale(.8);
      }
      to{
        transform:translate3d(var(--heart-drift,40px),120vh,0) rotate(360deg) scale(1.08);
      }
    }

    /* PAGE TURN */

    .page-turn-sheet{
      position:absolute;z-index:80;top:0;
      width:50%;height:100%;
      pointer-events:none;
      transform-style:preserve-3d;
    }

    .page-turn-sheet .turn-front,
    .page-turn-sheet .turn-back{
      position:absolute;inset:0;overflow:hidden;
      background:
        radial-gradient(circle at 14% 11%,#fff9 0 2px,transparent 3px),
        repeating-linear-gradient(0deg,#ab54740d 0 1px,transparent 1px 5px),
        var(--paper);
      backface-visibility:hidden;
      box-shadow:0 12px 28px rgba(90,40,60,.22);
    }

    .page-turn-sheet .turn-front{transform:translateZ(2px)}
    .page-turn-sheet .turn-back{transform:rotateY(180deg) translateZ(2px)}

    .page-turn-sheet::after{
      content:"";
      position:absolute;inset:0;z-index:20;
      pointer-events:none;opacity:0;
      background:linear-gradient(
        90deg,
        rgba(74,26,46,.42) 0%,
        rgba(255,255,255,.58) 38%,
        rgba(255,255,255,.16) 58%,
        rgba(74,26,46,.38) 100%
      );
    }

    .page-turn-sheet.forward{
      left:50%;transform-origin:left center;
      animation:realisticForwardTurn .7s cubic-bezier(.45,.05,.25,1) forwards;
    }

    .page-turn-sheet.backward{
      left:0;transform-origin:right center;
      animation:realisticBackwardTurn .7s cubic-bezier(.45,.05,.25,1) forwards;
    }

    .page-turn-sheet.forward::after,
    .page-turn-sheet.backward::after{
      animation:realisticTurnLighting .95s ease-in-out forwards;
    }

    @keyframes realisticForwardTurn{
      from{transform:rotateY(0deg)}
      to{transform:rotateY(-180deg)}
    }

    @keyframes realisticBackwardTurn{
      from{transform:rotateY(0deg)}
      to{transform:rotateY(180deg)}
    }

    @keyframes realisticTurnLighting{
      0%{opacity:0}
      20%{opacity:.16}
      45%{opacity:.72}
      58%{opacity:.88}
      78%{opacity:.24}
      100%{opacity:0}
    }

    /* PIXIES */

    .pixie-fly{
      position:absolute;z-index:45;
      width:30px;height:30px;pointer-events:none;
    }

    .pixie-body{
      position:absolute;inset:6px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff,#ffc2d6 45%,#e86e9c);
      box-shadow:0 0 6px #fff,0 0 12px #ff9ec4;
    }

    .pixie-wing{
      position:absolute;top:2px;
      width:17px;height:24px;
      border-radius:70% 30% 70% 30%;
      background:linear-gradient(145deg,#ffffffcc,#ffd9e8aa);
      box-shadow:0 0 8px #fff8;
      transform-origin:center;
      animation:pixieWings .22s ease-in-out infinite alternate;
    }

    .pixie-wing.left-wing{left:-14px;transform:rotate(-24deg)}
    .pixie-wing.right-wing{right:-14px;transform:scaleX(-1) rotate(-24deg);animation-name:pixieWingsRight}

    @keyframes pixieWings{
      from{transform:rotate(-24deg) scaleY(.65)}
      to{transform:rotate(-8deg) scaleY(1)}
    }

    @keyframes pixieWingsRight{
      from{transform:scaleX(-1) rotate(-24deg) scaleY(.65)}
      to{transform:scaleX(-1) rotate(-8deg) scaleY(1)}
    }

    .pixie-dust-layer{
      position:absolute;inset:0;z-index:5;
      pointer-events:none;overflow:visible;
    }

    .pixie-dust{
      position:absolute;
      width:7px;height:7px;border-radius:50%;
      background:radial-gradient(circle,#fff 0 30%,#ffc2d6 31% 60%,#e86e9c 61%);
      box-shadow:0 0 6px #fff,0 0 12px #ff9ec4;
      opacity:0;
      animation:pixieDustFade 1.2s ease-out forwards;
    }

    @keyframes pixieDustFade{
      0%{opacity:1;transform:scale(1)}
      100%{opacity:0;transform:scale(.2) translateY(18px)}
    }

    .pixie-fly.left{
      left:-54px;
      animation:pixiePathLeft 10s ease-in-out infinite;
    }

    @keyframes pixiePathLeft{
      0%{top:76%;transform:rotate(-10deg)}

    function photoCard(c){

    function noteCard(c){
      return `

          <strong>${c.title}</strong>
          ${c.text}

      `;

    function photoRow(list=[]){
  if(!list.length)return "";

  return `
    <section class="photo-row">
      ${list.slice(0,2).map(item=>`
        <figure class="small-portrait">
          <div class="small-portrait-image">
            ${
              item.src

    </section>

    function bindInteractions(){
      document.querySelectorAll(".music-card").forEach(card=>{
        card.onclick=()=>{
          const path=card.dataset.audio;

          if(activeAudio){
            activeAudio.pause();
            document.querySelectorAll(".music-card").forEach(x=>x.classList.remove("playing"));
          }

          backgroundMusic.pause();

          activeAudio=new Audio(path);

          activeAudio.play().catch(()=>alert(`Add your MP3 file at: ${path}`));
          card.classList.add("playing");

          activeAudio.onended=()=>{
            card.classList.remove("playing");
            activeAudio=null;
            backgroundMusic.play().catch(()=>{});
          };
        };
      });

      document.querySelectorAll(".envelope").forEach(envelope=>{
        envelope.onclick=()=>{
          document.getElementById(envelope.dataset.popup).classList.add("show");
        };
      });

      document.querySelectorAll(".close").forEach(button=>{
        button.onclick=()=>{
          button.closest(".popup").classList.remove("show");
        };
      });
    }

    function flip(direction){
      if(turning)return;

      const target=direction==="next"?current+1:current-1;

      if(target<0||target>=spreads.length)return;

      turning=true;

      if(activeAudio){
        activeAudio.pause();
        activeAudio=null;
        backgroundMusic.play().catch(()=>{});
      }

      const sourcePage=direction==="next"?rightPage:leftPage;

      const turnSheet=document.createElement("article");
      turnSheet.className=`page-turn-sheet ${direction==="next"?"forward":"backward"}`;

      turnSheet.innerHTML=`
        <div class="turn-front">${sourcePage.innerHTML}</div>
        <div class="turn-back">${sourcePage.innerHTML}</div>
      `;

      document.querySelector(".book-body").appendChild(turnSheet);

      const finishFlip=()=>{
        if(!turnSheet.isConnected)return;

        turnSheet.remove();

        current=target;
        render();
        turning=false;
      };

      turnSheet.addEventListener("animationend",finishFlip,{once:true});
      setTimeout(finishFlip,900);
    }

    function closeTheBook(){
      if(activeAudio){
        activeAudio.pause();
        activeAudio=null;
      }

      backgroundMusic.pause();

      openBook.classList.remove("show");

      setTimeout(()=>{
        backCover.classList.add("show");
      },350);
    }

    function openPhysicalBook(event){
      if(event){
        event.preventDefault();
        event.stopPropagation();
      }

      if(cover.classList.contains("open"))return;

      backgroundMusic.currentTime=0;
      backgroundMusic.play().catch(()=>{});

      cover.classList.add("open");
      openBook.classList.add("show");
      render();

      setTimeout(()=>{
        cover.style.pointerEvents="none";
        cover.style.visibility="hidden";
      },2000);
    }

    cover.addEventListener("click",openPhysicalBook);
    cover.addEventListener("touchend",openPhysicalBook,{passive:false});

    cover.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){
        openPhysicalBook(event);
      }
    });

    next.addEventListener("click",()=>flip("next"));
    previous.addEventListener("click",()=>flip("previous"));

    document.addEventListener("click",event=>{
      if(event.target.closest("#closeBookBtn")){
        closeTheBook();
      }
    });

   if(readAgainBtn){

    backgroundMusic.pause();

      backgroundMusic.currentTime=0;

    },350);

}

    const pixieFlyLayer=document.createElement("div");
    pixieFlyLayer.className="pixie-dust-layer";
    document.querySelector(".book-wrap").appendChild(pixieFlyLayer);

    function createFlyingPixie(side){
      const pixie=document.createElement("div");
      pixie.className=`pixie-fly ${side}`;

      pixie.innerHTML=`
        <span class="pixie-wing left-wing"></span>
        <span class="pixie-wing right-wing"></span>
        <span class="pixie-body"></span>
      `;

      pixieFlyLayer.appendChild(pixie);

      setInterval(()=>{
        if(turning)return;

        const dust=document.createElement("span");
        dust.className="pixie-dust";

        const pixieBox=pixie.getBoundingClientRect();
        const layerBox=pixieFlyLayer.getBoundingClientRect();

        dust.style.left=`${pixieBox.left-layerBox.left+2+Math.random()*26}px`;
        dust.style.top=`${pixieBox.top-layerBox.top+2+Math.random()*26}px`;

        const size=4+Math.random()*7;
        dust.style.width=`${size}px`;
        dust.style.height=`${size}px`;

        pixieFlyLayer.appendChild(dust);

        setTimeout(()=>dust.remove(),1400);
      },260);
    }
